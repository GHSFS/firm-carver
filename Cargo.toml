[package]
name = "firm-carver"
version = "0.6.0"
edition = "2021"

rust-version = "1.75"
description = "Zero-dependency IoT and embedded firmware container unpacker, multi-format magic carver, and static vulnerability auditing engine in pure Rust."
authors = ["GHSFS"]
license = "Apache-2.0"
repository = "https://github.com/GHSFS/firm-carver"
readme = "README.md"
keywords = ["firmware", "carver", "embedded", "iot-security", "squashfs"]
categories = ["command-line-utilities", "parser-implementations", "development-tools::debugging"]

[lib]
name = "firm_carver"
path = "src/lib.rs"

[[bin]]
name = "fcarver"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
zeroize = "1.8"
flate2 = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
blake3 = "1.5"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
